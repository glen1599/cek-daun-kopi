name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, type-check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/requirements.txt

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (CPU-only torch)
        run: |
          uv venv --python 3.11
          uv pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          uv pip install -r requirements.txt
          uv pip install pytest ruff mypy

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Ruff format check
        run: .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy

      - name: Pytest
        run: .venv/bin/pytest -q

  app:
    name: Flutter app (format, analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Dart format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test
